# Custom entry point for this V-Server.
# Target path on the server: /etc/nginx/sites-available/v-server
# Enable with:  ln -s /etc/nginx/sites-available/v-server /etc/nginx/sites-enabled/v-server
# The packaged default site must be disabled so this block answers requests
# that do not match any server_name: rm /etc/nginx/sites-enabled/default

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/v-server;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The Docusaurus blog runs in a container that is published on the loopback
    # interface only, so it is reachable through this proxy and not from the
    # outside directly. The trailing slash in proxy_pass strips the /blog/
    # prefix before the request reaches the container, which serves the site at
    # its own root; the image is built with BASE_URL=/blog/ so that the links it
    # generates point back through this prefix.
    location = /blog {
        return 301 /blog/;
    }

    location /blog/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Do not advertise the exact NGINX version in error pages and headers.
    server_tokens off;

    access_log /var/log/nginx/v-server.access.log;
    error_log  /var/log/nginx/v-server.error.log;
}
